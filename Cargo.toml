[package]
name = "rusty-os"
version = "0.1.0"
edition = "2024"

[dependencies]

# the profile used for `cargo build`
[profile.dev]
panic = "abort"  # disable stack unwinding on panic

# the profile used for `cargo build --release`
[profile.release]
panic = "abort"

[[bin]]
name = "rusty-os"
test = false
bench = false